name: life_os
description: Life OS - Personal Life Management System

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.2.0

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  google_sign_in: ^7.1.1

  # Notifications
  flutter_local_notifications: ^19.4.0

  # File Handling
  image_picker: ^1.2.0
  file_picker: ^10.3.2

  # Local Storage
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
